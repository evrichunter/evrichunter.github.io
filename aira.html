<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AIRA — Asistente Financiero</title>
<meta name="theme-color" content="#070707">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22AIRA%20%E2%80%94%20Asistente%20Financiero%22%2C%22short_name%22%3A%22AIRA%22%2C%22description%22%3A%22Asesora%20Inteligente%20de%20Recursos%20y%20Ahorro%22%2C%22start_url%22%3A%22.%2Faira.html%22%2C%22scope%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23070707%22%2C%22theme_color%22%3A%22%23070707%22%7D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070707'/%3E%3Ctext x='50' y='66' font-family='Georgia,serif' font-size='54' font-weight='700' fill='%23c8a96e' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070707'/%3E%3Ctext x='50' y='66' font-family='Georgia,serif' font-size='54' font-weight='700' fill='%23c8a96e' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIRA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070707;
    --bg-elev:#0f0f0f;
    --card:#141414;
    --card-2:#1a1a1a;
    --line:#242422;
    --gold:#c8a96e;
    --gold-soft:rgba(200,169,110,.14);
    --gold-dim:#8a744a;
    --text:#f2f0ea;
    --text-dim:#96958d;
    --text-faint:#5c5b54;
    --green:#7fae82;
    --red:#c07b6a;
    --radius:20px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans', -apple-system, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Syne', sans-serif;}
  #app{
    max-width:520px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(circle at 15% -10%, rgba(200,169,110,.07), transparent 45%),
      var(--bg);
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px;
    flex-shrink:0;
  }
  header .brand{display:flex; flex-direction:column;}
  header .brand .eyebrow{font-size:10px; letter-spacing:.18em; color:var(--text-faint); text-transform:uppercase;}
  header .brand h1{font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin:2px 0 0; letter-spacing:.01em;}
  header .brand h1 span{color:var(--gold);}
  header .actions{display:flex; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer;
    transition:background .2s, color .2s, transform .15s;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:hover{color:var(--gold); border-color:var(--gold-dim);}
  .icon-btn svg{width:17px; height:17px;}

  main{flex:1; min-height:0; position:relative;}
  .view{
    position:absolute; inset:0;
    overflow-y:auto;
    padding:0 20px 24px;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .view.active{opacity:1; pointer-events:auto; transform:translateY(0);}
  .view::-webkit-scrollbar{width:0;}

  #view-chat{display:flex; flex-direction:column; padding-bottom:0;}
  #chat-log{flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:14px;}
  .msg{max-width:86%; padding:12px 15px; border-radius:16px; font-size:14.5px; line-height:1.5; animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .msg.user{align-self:flex-end; background:var(--gold); color:#161105; border-bottom-right-radius:5px; font-weight:500;}
  .msg.bot{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; white-space:pre-wrap;}
  .msg.bot b{color:var(--gold); font-family:'Syne',sans-serif;}
  .msg .amt-pos{color:var(--green); font-weight:600;}
  .msg .amt-neg{color:var(--red); font-weight:600;}
  .empty-chat{margin:auto; text-align:center; color:var(--text-faint); font-size:13.5px; padding:40px 20px;}
  .empty-chat b{display:block; color:var(--text-dim); font-family:'Syne',sans-serif; font-size:16px; margin-bottom:6px;}

  .chat-input-bar{
    flex-shrink:0; display:flex; align-items:flex-end; gap:8px;
    padding:12px 0 calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
  }
  #chat-input{
    flex:1; resize:none; max-height:110px;
    background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:20px; padding:12px 16px; font-size:15px; font-family:inherit;
    outline:none;
  }
  #chat-input:focus{border-color:var(--gold-dim);}
  #chat-send{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background:var(--gold); border:none; color:#161105;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .15s;
  }
  #chat-send:active{transform:scale(.9);}
  #chat-send svg{width:18px; height:18px;}

  .section-pad{padding-top:6px;}
  .section-title{font-family:'Syne',sans-serif; font-size:22px; font-weight:700; margin:4px 0 18px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px;}
  .stat-card .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
  .stat-card .value{font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-top:6px;}
  .stat-card.wide{grid-column:1/3; display:flex; justify-content:space-between; align-items:center;}
  .stat-card.accent{background:var(--gold-soft); border-color:var(--gold-dim);}
  .stat-card.accent .value{color:var(--gold);}

  .subhead{font-family:'Syne',sans-serif; font-size:14px; color:var(--text-dim); margin:20px 0 12px; text-transform:uppercase; letter-spacing:.06em;}

  .pie-wrap{display:flex; justify-content:center; margin-bottom:14px;}
  .pie-wrap svg{filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));}
  .legend-row{display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:12.5px; color:var(--text-dim); border-bottom:1px solid var(--line);}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .legend-label{flex:1; color:var(--text); display:flex; align-items:center; gap:6px;}
  .legend-pct{color:var(--text-faint); width:36px; text-align:right; flex-shrink:0;}
  .legend-amt{width:82px; text-align:right; color:var(--text-dim); flex-shrink:0;}
  .pie-empty{text-align:center; color:var(--text-faint); font-size:13px; padding:16px 0 4px;}
  .cat-edit-input{
    background:var(--card-2); border:1px solid var(--gold-dim); color:var(--text);
    border-radius:8px; padding:4px 8px; font-size:13px; font-family:inherit; width:150px;
  }
  .edit-cat-btn{color:var(--text-faint); cursor:pointer; margin-left:6px; font-size:12px;}
  .edit-cat-btn:hover{color:var(--gold);}

  .oblig-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .oblig-row:last-child{border-bottom:none;}
  .oblig-row .pend{color:var(--red);}
  .oblig-row .done{color:var(--green);}

  .fund-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px;}
  .fund-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .fund-name{font-family:'Syne',sans-serif; font-size:15px; font-weight:600;}
  .fund-pct{font-size:11px; color:var(--text-faint); background:var(--card-2); padding:3px 8px; border-radius:20px;}
  .fund-amt{font-size:22px; font-family:'Syne',sans-serif; font-weight:700; margin-bottom:8px;}
  .fund-amt .goal{font-size:13px; color:var(--text-faint); font-weight:400; font-family:'DM Sans',sans-serif;}
  .fund-bar-track{height:7px; background:var(--card-2); border-radius:6px; overflow:hidden;}
  .fund-bar-fill{height:100%; border-radius:6px; background:var(--gold); transition:width .6s ease;}
  .fund-bar-fill.done{background:var(--green);}
  .fund-tag{display:inline-block; margin-top:8px; font-size:10.5px; color:var(--green); background:rgba(127,174,130,.12); padding:3px 8px; border-radius:20px;}

  .rec-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px;}
  .rec-card.paid{opacity:.55;}
  .rec-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .rec-client{font-family:'Syne',sans-serif; font-size:15px; font-weight:600;}
  .rec-concept{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .rec-type-tag{font-size:10px; color:var(--text-faint); background:var(--card-2); padding:3px 8px; border-radius:20px; flex-shrink:0; margin-left:8px;}
  .rec-amounts{display:flex; justify-content:space-between; align-items:baseline; margin:10px 0;}
  .rec-pending{font-family:'Syne',sans-serif; font-size:20px; font-weight:700;}
  .rec-total{font-size:11.5px; color:var(--text-faint);}
  .rec-due{font-size:11.5px; color:var(--text-faint); margin-bottom:10px;}
  .rec-actions{display:flex; gap:8px;}
  .rec-btn{flex:1; text-align:center; padding:9px; border-radius:10px; font-size:12.5px; cursor:pointer; border:1px solid var(--line);}
  .rec-btn.paidbtn{background:var(--gold-soft); border-color:var(--gold-dim); color:var(--gold);}
  .rec-btn.delbtn{background:none; color:var(--text-faint);}
  .rec-btn.delbtn:hover{color:var(--red); border-color:var(--red);}
  .rec-empty{text-align:center; color:var(--text-faint); font-size:13px; padding:30px 0;}
  .type-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .type-toggle button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text-dim); font-size:13px; cursor:pointer; font-family:inherit;}
  .type-toggle button.on{background:var(--gold-soft); border-color:var(--gold-dim); color:var(--gold);}

  nav#bottomnav{
    flex-shrink:0; display:flex; justify-content:space-around;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--bg-elev);
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-faint); font-family:'DM Sans',sans-serif;
    font-size:10.5px; padding:6px 12px; cursor:pointer; transition:color .2s;
  }
  .navbtn svg{width:21px; height:21px;}
  .navbtn.active{color:var(--gold);}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .sheet-backdrop.active{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translate(-50%, 100%);
    width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    background:var(--bg-elev); border-radius:24px 24px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:18px 20px calc(24px + env(safe-area-inset-bottom));
    transition:transform .3s cubic-bezier(.32,.72,0,1); z-index:51;
  }
  .sheet-backdrop.active .sheet{transform:translate(-50%, 0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;}
  .sheet-title{font-family:'Syne',sans-serif; font-size:19px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}

  .hrow{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .hrow:last-child{border-bottom:none;}
  .hrow .amt{font-family:'Syne',sans-serif; font-weight:700;}
  .hrow .amt.pos{color:var(--green);}
  .hrow .amt.neg{color:var(--red);}
  .hrow .meta{color:var(--text-faint); font-size:11.5px;}
  .undo-btn{background:var(--card); border:1px solid var(--line); color:var(--text-faint); font-size:11px; padding:5px 10px; border-radius:14px; cursor:pointer;}
  .undo-btn:hover{color:var(--red); border-color:var(--red);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input{width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; font-family:inherit;}
  .field input:focus{outline:none; border-color:var(--gold-dim);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .toggle-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0;}
  .toggle{width:42px; height:24px; border-radius:20px; background:var(--card-2); position:relative; cursor:pointer; border:1px solid var(--line); flex-shrink:0;}
  .toggle.on{background:var(--gold-soft); border-color:var(--gold-dim);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-faint); transition:transform .2s, background .2s;}
  .toggle.on .knob{transform:translateX(18px); background:var(--gold);}

  .fund-edit-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .fund-edit-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fund-edit-head input.name-input{background:transparent; border:none; font-family:'Syne',sans-serif; font-size:15px; font-weight:600; color:var(--text); padding:0;}
  .remove-fund{color:var(--red); font-size:11px; cursor:pointer; opacity:.7;}
  .pct-total{font-size:12px; color:var(--text-dim); text-align:center; margin:6px 0 18px;}
  .pct-total.bad{color:var(--red);}

  .btn-primary{
    width:100%; background:var(--gold); color:#161105; border:none; padding:14px; border-radius:14px;
    font-family:'Syne',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-ghost{
    width:100%; background:none; color:var(--text-dim); border:1px dashed var(--line); padding:12px; border-radius:14px;
    font-size:13px; cursor:pointer; margin-top:4px;
  }
  .close-x{color:var(--text-faint); cursor:pointer; font-size:20px; line-height:1;}

  #splash{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(200,169,110,.10), transparent 60%), var(--bg);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-inner{position:relative; display:flex; flex-direction:column; align-items:center;}
  .splash-logo{
    font-family:'Syne',sans-serif; font-weight:800; font-size:52px; letter-spacing:.03em;
    background:linear-gradient(120deg, var(--text) 35%, var(--gold) 50%, var(--text) 65%);
    background-size:280% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:aira-shine 2.2s ease-in-out infinite;
  }
  .splash-logo span{ color:var(--gold); -webkit-text-fill-color:var(--gold); }
  @keyframes aira-shine{ 0%{background-position:220% 0;} 100%{background-position:-120% 0;} }
  .splash-sub{
    margin-top:14px; font-size:13.5px; color:var(--text-dim); text-align:center; letter-spacing:.01em;
    opacity:0; animation:aira-fadein .7s ease forwards; animation-delay:.55s;
  }
  @keyframes aira-fadein{ to{opacity:1;} }
  .splash-spark{position:absolute; color:var(--gold); opacity:0; animation:aira-spark 1.6s ease-in-out infinite;}
  .splash-spark.s1{top:-18px; left:-28px; font-size:16px; animation-delay:.2s;}
  .splash-spark.s2{top:6px; right:-34px; font-size:12px; animation-delay:.7s;}
  .splash-spark.s3{bottom:-14px; left:20%; font-size:10px; animation-delay:1.1s;}
  @keyframes aira-spark{ 0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:1; transform:scale(1.15);} }

  #noa-sync-badge{
    position:fixed; top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:60; display:flex; align-items:center; gap:6px;
    background:rgba(20,20,20,.92); border:1px solid #242422; padding:5px 13px; border-radius:20px;
    font-family:'DM Sans',sans-serif; font-size:11px; color:#96958d; backdrop-filter:blur(6px);
    transition:opacity .3s, background .3s; pointer-events:none;
  }
  #noa-sync-badge .dot{width:7px; height:7px; border-radius:50%; background:#5c5b54; transition:background .3s; flex-shrink:0;}
  #noa-sync-badge.state-synced .dot{background:#7fae82;}
  #noa-sync-badge.state-error .dot{background:#c07b6a;}
  #noa-sync-badge.state-connecting .dot{background:#c8a96e; animation:noa-pulse 1s infinite;}
  @keyframes noa-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <span class="splash-spark s1">✦</span>
    <span class="splash-spark s2">✦</span>
    <span class="splash-spark s3">✦</span>
    <div class="splash-logo">AIR<span>A</span></div>
    <div class="splash-sub">Bienvenido Evric, así están tus cuentas</div>
  </div>
</div>

<div id="app">

  <header>
    <div class="brand">
      <span class="eyebrow">Asesora Inteligente de Recursos y Ahorro</span>
      <h1>AIR<span>A</span></h1>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-clear-chat" title="Vaciar chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
      <button class="icon-btn" id="btn-history" title="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

<script type="module">
/* =====================================================================
   AIRA — motor de datos + sincronización en tiempo real (Firebase RTDB)

   POR QUÉ SE REESCRIBIÓ LA SINCRONIZACIÓN:
   La versión anterior guardaba TODA la base de datos como un solo blob
   en "noa/data" y decidía qué dispositivo "ganaba" comparando timestamps
   (last-write-wins). Eso significa que si anotabas un gasto en el celular
   y a los pocos segundos anotabas un ingreso en la compu (antes de que
   el celular terminara de sincronizar), uno de los dos movimientos se
   PERDÍA por completo, silenciosamente.

   Ahora cada movimiento, cobro y mensaje de chat vive en su propio
   registro con ID único (aira/transactions/{id}, aira/receivables/{id},
   aira/chat/{id}). Dos dispositivos escribiendo casi al mismo tiempo
   crean dos claves distintas: Firebase las une automáticamente, nadie
   pisa a nadie.

   Los SALDOS de los fondos ya no se "fijan" a un valor absoluto: se
   ajustan de forma atómica con runTransaction (sumar/restar sobre el
   valor real que hay en el servidor en ese instante), así que dos
   ingresos simultáneos desde dos dispositivos se acumulan correctamente
   en vez de que uno sobreescriba al otro.

   Los fondos con reinicio mensual (Alquiler, Servicios) guardan junto
   al valor el mes en el que se acumuló ("monthKey"); si cambia el mes,
   se consideran en 0 automáticamente la próxima vez que se toquen o se
   muestren, sin depender de que algún dispositivo esté abierto justo
   el día que cambia el mes.
   ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getDatabase, ref, set, update, remove, onValue, runTransaction
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDWE64UYQMQFKT0nreF7ax59gzI2OsIVmE",
  authDomain: "evric-agenda.firebaseapp.com",
  databaseURL: "https://evric-agenda-default-rtdb.firebaseio.com",
  projectId: "evric-agenda",
  storageBucket: "evric-agenda.firebasestorage.app",
  messagingSenderId: "239254402707",
  appId: "1:239254402707:web:bda9f7ae205b14cb81bf66"
};

const app = initializeApp(firebaseConfig, 'aira-app');
const db  = initDb(app);
function initDb(a){ return getDatabase(a); }

const PATH = {
  config: 'aira/config',
  balances: 'aira/balances',
  tx: 'aira/transactions',
  rec: 'aira/receivables',
  chat: 'aira/chat'
};
const R = {
  config: ref(db, PATH.config),
  balances: ref(db, PATH.balances),
  tx: ref(db, PATH.tx),
  rec: ref(db, PATH.rec),
  chat: ref(db, PATH.chat),
  connected: ref(db, '.info/connected')
};

const DEFAULT_FUNDS = {
  personal:   {name:'Dinero Personal',      percent:20, goal:0,      resetMonthly:false, priority:1},
  pareja:     {name:'Pareja',                percent:5,  goal:0,      resetMonthly:false, priority:2},
  alquiler:   {name:'Alquiler',              percent:20, goal:300000, resetMonthly:true,  priority:3},
  servicios:  {name:'Servicios',             percent:10, goal:80000,  resetMonthly:true,  priority:4},
  deuda:      {name:'Deuda',                 percent:10, goal:0,      resetMonthly:false, priority:5},
  emergencia: {name:'Emergencia',            percent:15, goal:0,      resetMonthly:false, priority:6},
  equipos:    {name:'Equipos y Formación',   percent:10, goal:0,      resetMonthly:false, priority:7},
  marketing:  {name:'Marketing',             percent:5,  goal:0,      resetMonthly:false, priority:8},
  inversiones:{name:'Inversiones',           percent:5,  goal:0,      resetMonthly:false, priority:9}
};

function currentMonthKey(){ const d = new Date(); return d.getFullYear()+'-'+d.getMonth(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){ n = Math.round(n||0); return '$' + n.toLocaleString('es-AR'); }
function escapeHtml(s){ const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }
function normalize(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

/* ---------------- ESTADO EN MEMORIA (reflejo de Firebase) ---------------- */
let funds = null;              // {id:{name,percent,goal,resetMonthly,priority}}
let balances = {};             // {id:{value, monthKey}}
let transactions = {};         // {id:tx}
let receivables = {};          // {id:rec}
let chatMsgs = {};             // {id:{text,who,ts}}
let localOptimisticChat = {};  // eco visual instantáneo antes de la confirmación del servidor
let pendingClarification = null; // "¿fue ingreso o gasto?" — solo de este dispositivo, no se sincroniza
let connected = false;
const ready = {config:false, balances:false, tx:false, rec:false, chat:false};
function allReady(){ return ready.config && ready.balances && ready.tx && ready.rec && ready.chat; }

/* ---------------- CARGA / SEMBRADO INICIAL (sin condiciones de carrera) --- */
onValue(R.config, snap=>{
  const val = snap.val();
  if(val === null){
    // Primera vez que se usa la app en este proyecto de Firebase: siembra
    // los fondos por defecto de forma segura (si dos dispositivos abren la
    // app por primera vez a la vez, runTransaction evita que se pisen).
    runTransaction(R.config, cur => cur === null ? {funds: DEFAULT_FUNDS} : cur)
      .catch(err=>console.error('AIRA: error sembrando configuración', err));
    return;
  }
  funds = val.funds || DEFAULT_FUNDS;
  ready.config = true;
  reconcileBalances();
  renderAll();
  updateBadge();
});

onValue(R.balances, snap=>{
  balances = snap.val() || {};
  ready.balances = true;
  reconcileBalances();
  renderAll();
  updateBadge();
});

function reconcileBalances(){
  if(!ready.config || !ready.balances || !funds) return;
  Object.keys(funds).forEach(id=>{
    if(!(id in balances)){
      runTransaction(ref(db, PATH.balances + '/' + id), cur => cur === null ? {value:0, monthKey:currentMonthKey()} : cur)
        .catch(err=>console.error('AIRA: error inicializando saldo de fondo', id, err));
    }
  });
}

onValue(R.tx, snap=>{ transactions = snap.val() || {}; ready.tx = true; renderAll(); updateBadge(); });
onValue(R.rec, snap=>{ receivables = snap.val() || {}; ready.rec = true; renderAll(); updateBadge(); });
onValue(R.chat, snap=>{
  chatMsgs = snap.val() || {};
  Object.keys(localOptimisticChat).forEach(id=>{ if(chatMsgs[id]) delete localOptimisticChat[id]; });
  ready.chat = true;
  renderChat();
  updateBadge();
});
onValue(R.connected, snap=>{ connected = snap.val() === true; updateBadge(); });

/* ---------------- SALDOS: lectura y escritura atómica -------------------- */
function effectiveBalance(fundId){
  const f = funds && funds[fundId];
  const b = balances[fundId];
  if(!f || !b) return 0;
  if(f.resetMonthly && b.monthKey !== currentMonthKey()) return 0; // "reinicio perezoso": sin depender de que nadie abra la app justo al cambiar el mes
  return b.value || 0;
}
function isFundComplete(fundId){
  const f = funds && funds[fundId];
  if(!f) return false;
  return f.goal > 0 && effectiveBalance(fundId) >= f.goal;
}
function adjustBalance(fundId, delta){
  const f = funds && funds[fundId];
  const monthly = !!(f && f.resetMonthly);
  const path = ref(db, PATH.balances + '/' + fundId);
  return runTransaction(path, cur=>{
    const stillValid = cur && (!monthly || cur.monthKey === currentMonthKey());
    const curVal = stillValid ? (cur.value || 0) : 0;
    return {value: curVal + delta, monthKey: currentMonthKey()};
  });
}
function applyDeltas(deltas){
  Object.entries(deltas).forEach(([id, amt])=>{
    if(amt) adjustBalance(id, amt).catch(err=>console.error('AIRA: error ajustando fondo', id, err));
  });
}

/* ---------------- REPARTO PROPORCIONAL DE INGRESOS ------------------------ */
function distributeIncome(amount){
  const deltas = {};
  let remaining = amount;
  let pool = Object.keys(funds).filter(id=>!isFundComplete(id));
  let guard = 0;
  while(remaining > 0 && pool.length && guard < 20){
    guard++;
    const totalPct = pool.reduce((s,id)=>s+(funds[id].percent||0),0) || 1;
    let distributedThisPass = 0;
    const stillOpen = [];
    pool.slice().sort((a,b)=>(funds[a].priority||0)-(funds[b].priority||0)).forEach(id=>{
      const f = funds[id];
      let share = Math.round(remaining * ((f.percent||0)/totalPct));
      if(f.goal > 0){
        const room = f.goal - effectiveBalance(id) - (deltas[id]||0);
        if(share > room) share = Math.max(room, 0);
      }
      if(share > remaining - distributedThisPass) share = remaining - distributedThisPass;
      if(share > 0){
        deltas[id] = (deltas[id]||0) + share;
        distributedThisPass += share;
      }
      const projected = effectiveBalance(id) + (deltas[id]||0);
      const willBeFull = f.goal > 0 && projected >= f.goal;
      if(!willBeFull) stillOpen.push(id);
    });
    remaining -= distributedThisPass;
    pool = stillOpen;
    if(distributedThisPass === 0) break;
  }
  if(remaining > 0){
    deltas.personal = (deltas.personal||0) + remaining;
  }
  const breakdown = Object.entries(deltas).filter(([,amt])=>amt>0).map(([id,amt])=>{
    const f = funds[id];
    const projected = effectiveBalance(id) + amt;
    return {fundId:id, name: f ? f.name : id, amount:amt, completed: !!(f && f.goal>0 && projected>=f.goal)};
  });
  return {deltas, breakdown};
}

/* ---------------- ESCRITURA DE MOVIMIENTOS / COBROS / CHAT ---------------- */
function pushTx(tx){
  set(ref(db, PATH.tx + '/' + uid()), tx).catch(err=>console.error('AIRA: error guardando movimiento', err));
}
function undoTransaction(id){
  const tx = transactions[id];
  if(!tx) return;
  (tx.breakdown||[]).forEach(b=> adjustBalance(b.fundId, -b.amount).catch(err=>console.error('AIRA: error deshaciendo ajuste de fondo', err)));
  remove(ref(db, PATH.tx + '/' + id)).catch(err=>console.error('AIRA: error deshaciendo movimiento', err));
}
function receivablePending(r){
  if(r.recurring) return (r.paidMonthKey === currentMonthKey()) ? 0 : r.monthlyAmount;
  return Math.max(0, (r.totalAmount||0) - (r.deposit||0));
}
function receivableIsSettled(r){
  return r.recurring ? (r.paidMonthKey === currentMonthKey()) : receivablePending(r) <= 0;
}
function markReceivablePaid(id){
  const r = receivables[id];
  if(!r) return;
  const amt = receivablePending(r);
  if(amt > 0){
    const {deltas, breakdown} = distributeIncome(amt);
    applyDeltas(deltas);
    pushTx({ts:Date.now(), type:'income', amount:amt, category: r.recurring ? 'Membresía — '+r.client : 'Cobro — '+r.client, raw:'', breakdown});
  }
  if(r.recurring){
    update(ref(db, PATH.rec + '/' + id), {paidMonthKey: currentMonthKey()}).catch(err=>console.error(err));
  } else {
    update(ref(db, PATH.rec + '/' + id), {deposit: r.totalAmount}).catch(err=>console.error(err));
  }
}
function deleteReceivable(id){
  remove(ref(db, PATH.rec + '/' + id)).catch(err=>console.error('AIRA: error eliminando cobro', err));
}

function botMessage(html){
  const id = uid(), ts = Date.now();
  localOptimisticChat[id] = {text:html, who:'bot', ts};
  renderChat();
  set(ref(db, PATH.chat + '/' + id), {text:html, who:'bot', ts}).catch(err=>console.error('AIRA: error guardando mensaje', err));
}
function userMessageEcho(text){
  const id = uid(), ts = Date.now();
  const safe = escapeHtml(text);
  localOptimisticChat[id] = {text:safe, who:'user', ts};
  renderChat();
  set(ref(db, PATH.chat + '/' + id), {text:safe, who:'user', ts}).catch(err=>console.error('AIRA: error guardando mensaje', err));
}

function processIncome(amount, raw, catRow){
  const {deltas, breakdown} = distributeIncome(amount);
  const before = {};
  Object.keys(deltas).forEach(id=> before[id] = effectiveBalance(id));
  applyDeltas(deltas);
  pushTx({ts:Date.now(), type:'income', amount, category: catRow ? catRow.cat : 'Ingreso', raw, breakdown});
  let lines = '<b>Ingreso registrado</b>\n' + fmt(amount) + '\n\nDistribución automática:\n';
  breakdown.forEach(b=>{
    lines += '• ' + b.name + ' <span class="amt-pos">+' + fmt(b.amount) + '</span>' + (b.completed ? ' → completo ✅' : '') + '\n';
  });
  const disponible = Object.keys(funds).filter(id=>!['alquiler','servicios','deuda'].includes(id))
    .reduce((s,id)=> s + before[id] + (deltas[id]||0), 0);
  lines += '\nDisponible ahora: ' + fmt(disponible);
  botMessage(lines);
}

function processExpense(amount, raw, catRow){
  const fundId = (catRow && funds[catRow.fund]) ? catRow.fund : 'personal';
  const f = funds[fundId];
  const before = effectiveBalance(fundId);
  applyDeltas({[fundId]: -amount});
  pushTx({ts:Date.now(), type:'expense', amount, category: catRow ? catRow.cat : 'Otros', raw, breakdown:[{fundId, name:f.name, amount:-amount}]});
  const projected = before - amount;
  let msg = '<b>Gasto registrado</b>\n' + fmt(amount) + ' — ' + (catRow ? catRow.cat : 'Otros') + '\nFondo afectado: ' + f.name;
  if(projected < 0) msg += '\n⚠️ Saldo del fondo en negativo.';
  msg += '\nSaldo restante: <span class="' + (projected>=0?'amt-pos':'amt-neg') + '">' + fmt(projected) + '</span>';
  botMessage(msg);
}

/* ---------------- NLU: interpretación del mensaje de chat ----------------- */
const INCOME_WORDS  = ['entr','ingres','recib','cobr','deposit','gan','entrada','me pagaron'];
const REFUND_WORDS  = ['devol','reembols'];
const EXPENSE_WORDS = ['gast','pagu','compr','sali','saque','abon'];

const CATEGORY_MAP = [
  {keys:['alquiler','renta'], cat:'Alquiler', fund:'alquiler'},
  {keys:['luz','gas natural',' gas ','internet','wifi','telefon','celular','servicio'], cat:'Servicios', fund:'servicios'},
  {keys:['plugin','sinte','microfono','interfaz','monitores de estudio','cable','equipo','licencia','software audio'], cat:'Equipos y Formación', fund:'equipos'},
  {keys:['estudio','formacion','curso','capacitacion'], cat:'Equipos y Formación', fund:'equipos'},
  {keys:['marketing','publicidad','ads','anuncio','promocion'], cat:'Marketing', fund:'marketing'},
  {keys:['inversion','cripto','acciones','plazo fijo'], cat:'Inversiones', fund:'inversiones'},
  {keys:['deuda','prestamo','cuota tarjeta','tarjeta de credito'], cat:'Deuda', fund:'deuda'},
  {keys:['pareja','novia','novio','esposa','esposo'], cat:'Pareja', fund:'pareja'},
  {keys:['emergencia'], cat:'Emergencia', fund:'emergencia'},
  {keys:['supermercado','super','almacen','verduleria','carniceria'], cat:'Supermercado', fund:'personal'},
  {keys:['uber','taxi','remis','nafta','combustible','colectivo','subte'], cat:'Transporte', fund:'personal'},
  {keys:['delivery','comida','restaurant','resto','pedidos ya','rappi'], cat:'Comida afuera', fund:'personal'},
  {keys:['ropa','indumentaria'], cat:'Ropa', fund:'personal'},
  {keys:['salud','farmacia','medico','remedios'], cat:'Salud', fund:'personal'}
];

function findAmount(normText){
  const matches = normText.match(/\d[\d.,]*\d|\d/g);
  if(!matches) return null;
  let best = null, bestVal = -1;
  matches.forEach(m=>{
    const digits = m.replace(/[.,]/g,'');
    const val = parseInt(digits, 10);
    if(!isNaN(val) && val > bestVal){ bestVal = val; best = val; }
  });
  return best;
}
function detectCategory(normText){
  for(const row of CATEGORY_MAP){ for(const k of row.keys){ if(normText.includes(k)) return row; } }
  return null;
}
function detectType(normText){
  if(REFUND_WORDS.some(w=>normText.includes(w))) return 'refund';
  const hasIncome = INCOME_WORDS.some(w=>normText.includes(w));
  const hasExpense = EXPENSE_WORDS.some(w=>normText.includes(w));
  if(hasExpense) return 'expense';
  if(hasIncome) return 'income';
  return null;
}
function parseMessage(raw){
  const n = normalize(raw);
  return {raw, type: detectType(n), amount: findAmount(n), catRow: detectCategory(n)};
}

function handleUserMessage(text){
  text = text.trim();
  if(!text) return;
  if(!allReady()){
    botMessage('Todavía estoy sincronizando tus datos con la nube — esperá un segundo e intentá de nuevo.');
    return;
  }
  userMessageEcho(text);

  if(pendingClarification){
    const n = normalize(text);
    if(n.includes('ingreso') || n.includes('entro') || n.includes('cobre')){
      processIncome(pendingClarification.amount, pendingClarification.raw, pendingClarification.catRow);
      pendingClarification = null;
      return;
    }
    if(n.includes('gasto') || n.includes('pague') || n.includes('gaste')){
      processExpense(pendingClarification.amount, pendingClarification.raw, pendingClarification.catRow);
      pendingClarification = null;
      return;
    }
  }

  const parsed = parseMessage(text);

  if(parsed.type === 'refund'){
    const amt = parsed.amount || 0;
    if(!amt){ botMessage('¿De cuánto fue la devolución? Decime el monto.'); return; }
    applyDeltas({personal: amt});
    pushTx({ts:Date.now(), type:'income', amount:amt, category:'Devolución', raw:text, breakdown:[{fundId:'personal', name:funds.personal.name, amount:amt}]});
    const projected = effectiveBalance('personal') + amt;
    botMessage('<b>Reembolso recibido</b>\n' + fmt(amt) + ' agregado directamente a <b>Dinero Personal</b>.\nNuevo saldo: ' + fmt(projected));
    return;
  }

  if(parsed.type === 'income'){
    if(!parsed.amount){ botMessage('¿De cuánto fue el ingreso? Decime el monto, por ejemplo "Entraron 90000".'); return; }
    processIncome(parsed.amount, text, parsed.catRow);
    return;
  }

  if(parsed.type === 'expense'){
    let amt = parsed.amount;
    if(!amt && parsed.catRow){
      const fid = parsed.catRow.fund;
      const eb = effectiveBalance(fid);
      if(funds[fid] && funds[fid].goal > 0 && eb > 0) amt = eb;
    }
    if(!amt){ botMessage('¿De cuánto fue el gasto? Decime el monto, por ejemplo "Gasté 8500 en supermercado".'); return; }
    processExpense(amt, text, parsed.catRow);
    return;
  }

  if(parsed.amount){
    pendingClarification = {amount:parsed.amount, raw:text, catRow:parsed.catRow};
    botMessage('No entendí si fue un <b>ingreso</b> o un <b>gasto</b> de ' + fmt(parsed.amount) + '. Respondé "ingreso" o "gasto" para confirmarlo.');
    return;
  }

  botMessage('No pude identificar un monto en ese mensaje. Probá algo como "Gasté 8500 en supermercado" o "Entraron 90000".');
}

/* ---------------- RENDER: charts helpers ------------------------------ */
const PIE_COLORS = ['#c8a96e','#7fae82','#c07b6a','#7a93c0','#a586c9','#6fbfae','#d1975c','#c98aa8','#9fb768','#7f9bc4'];
function colorForLabel(label){
  let hash = 0;
  for(let i=0;i<label.length;i++){ hash = (hash*31 + label.charCodeAt(i)) >>> 0; }
  return PIE_COLORS[hash % PIE_COLORS.length];
}
function buildPieSVG(entries, size){
  size = size || 150;
  const total = entries.reduce((s,[,v])=>s+v,0) || 1;
  const R2 = size/2, cx = R2, cy = R2;
  if(entries.length === 1){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${R2-1}" fill="${colorForLabel(entries[0][0])}"/></svg>`;
  }
  let angle = -90;
  const toRad = d => d*Math.PI/180;
  const paths = entries.map(([label, val])=>{
    const sweep = (val/total)*360;
    const start = angle, end = angle + sweep;
    angle = end;
    const large = sweep > 180 ? 1 : 0;
    const x1 = cx + R2*Math.cos(toRad(start)), y1 = cy + R2*Math.sin(toRad(start));
    const x2 = cx + R2*Math.cos(toRad(end)), y2 = cy + R2*Math.sin(toRad(end));
    return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${R2},${R2} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${colorForLabel(label)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}
function buildLegend(entries, total){
  return entries.map(([label,val])=>{
    const pct = total ? Math.round(val/total*100) : 0;
    return `<div class="legend-row"><span class="legend-dot" style="background:${colorForLabel(label)}"></span><span class="legend-label">${label}</span><span class="legend-pct">${pct}%</span><span class="legend-amt">${fmt(val)}</span></div>`;
  }).join('');
}

/* ---------------- RENDER: helpers de datos ----------------------------- */
function fundsArraySorted(){
  return Object.entries(funds || {}).sort((a,b)=>(a[1].priority||0)-(b[1].priority||0));
}
function transactionsArray(){
  return Object.entries(transactions||{}).map(([id,tx])=>Object.assign({id}, tx)).sort((a,b)=>b.ts-a.ts);
}
function receivablesArray(){
  return Object.entries(receivables||{}).map(([id,r])=>Object.assign({id}, r));
}

/* ---------------- RENDER: Estado (stats) ------------------------------- */
function renderStats(){
  const grid = document.getElementById('stat-grid');
  if(!allReady()){
    grid.innerHTML = '<div style="grid-column:1/3;text-align:center;color:var(--text-faint);font-size:13px;padding:20px 0;">Cargando datos…</div>';
    document.getElementById('income-breakdown').innerHTML = '';
    document.getElementById('cat-breakdown').innerHTML = '';
    document.getElementById('oblig-list').innerHTML = '';
    return;
  }
  const now = new Date();
  const txArr = transactionsArray();
  const monthTx = txArr.filter(t=>{ const d = new Date(t.ts); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); });
  const ingresos = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const gastos = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const ahorro = ingresos - gastos;
  const promedioDiario = gastos / now.getDate();
  const disponible = Object.keys(funds).reduce((s,id)=>s+effectiveBalance(id),0);
  const fondosCompletos = Object.keys(funds).filter(isFundComplete).length;

  grid.innerHTML = `
    <div class="stat-card"><div class="label">Ingresos del mes</div><div class="value">${fmt(ingresos)}</div></div>
    <div class="stat-card"><div class="label">Gastos del mes</div><div class="value">${fmt(gastos)}</div></div>
    <div class="stat-card accent"><div class="label">Ahorro generado</div><div class="value">${fmt(ahorro)}</div></div>
    <div class="stat-card"><div class="label">Promedio diario</div><div class="value">${fmt(promedioDiario)}</div></div>
    <div class="stat-card wide"><div><div class="label">Disponible total</div><div class="value">${fmt(disponible)}</div></div><div style="text-align:right"><div class="label">Fondos completos</div><div class="value">${fondosCompletos}/${Object.keys(funds).length}</div></div></div>
  `;

  const incomeTotals = {};
  monthTx.filter(t=>t.type==='income').forEach(t=>{ incomeTotals[t.category] = (incomeTotals[t.category]||0) + t.amount; });
  const incomeEntries = Object.entries(incomeTotals).sort((a,b)=>b[1]-a[1]);
  const incomeSum = incomeEntries.reduce((s,[,v])=>s+v,0);
  document.getElementById('income-breakdown').innerHTML = incomeEntries.length
    ? `<div class="pie-wrap">${buildPieSVG(incomeEntries,150)}</div>` + buildLegend(incomeEntries, incomeSum)
    : '<div class="pie-empty">Sin ingresos registrados este mes.</div>';

  const catTotals = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{ catTotals[t.category] = (catTotals[t.category]||0) + t.amount; });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catSum = catEntries.reduce((s,[,v])=>s+v,0);
  document.getElementById('cat-breakdown').innerHTML = catEntries.length
    ? `<div class="pie-wrap">${buildPieSVG(catEntries,150)}</div>` + buildLegend(catEntries, catSum)
    : '<div class="pie-empty">Sin gastos registrados este mes.</div>';

  const obligFunds = Object.entries(funds).filter(([,f])=>f.resetMonthly && f.goal>0);
  document.getElementById('oblig-list').innerHTML = obligFunds.length
    ? obligFunds.map(([id,f])=>{
        const done = isFundComplete(id);
        return `<div class="oblig-row"><span>${f.name}</span><span class="${done?'done':'pend'}">${done ? 'Completo ✅' : fmt(f.goal-effectiveBalance(id))+' restante'}</span></div>`;
      }).join('')
    : '<div style="color:var(--text-faint); font-size:13px; padding:6px 0 4px;">No hay obligaciones configuradas.</div>';
}

/* ---------------- RENDER: Cobros ---------------------------------------- */
function renderReceivables(){
  const el = document.getElementById('receivables-list');
  if(!ready.rec){
    el.innerHTML = '<div class="rec-empty">Cargando cobros…</div>';
    return;
  }
  const list = receivablesArray().sort((a,b)=>{
    const aSettled = receivableIsSettled(a), bSettled = receivableIsSettled(b);
    if(aSettled !== bSettled) return aSettled ? 1 : -1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  if(!list.length){
    el.innerHTML = '<div class="rec-empty">Todavía no cargaste ningún cobro pendiente.<br>Usá "+ Nuevo cobro" para registrar una seña, un saldo o una membresía.</div>';
    return;
  }
  el.innerHTML = list.map(r=>{
    const pending = receivablePending(r);
    const settled = receivableIsSettled(r);
    const typeLabel = r.recurring ? 'Mensual' : 'Único';
    const dueLabel = r.recurring ? (r.dueNote ? 'Cobra el '+r.dueNote : '') : (r.dueNote ? 'Entrega estimada: '+r.dueNote : '');
    return `<div class="rec-card ${settled?'paid':''}">
      <div class="rec-top">
        <div><div class="rec-client">${r.client||'Sin nombre'}</div><div class="rec-concept">${r.concept||''}</div></div>
        <span class="rec-type-tag">${typeLabel}</span>
      </div>
      <div class="rec-amounts">
        <span class="rec-pending">${settled ? 'Cobrado ✅' : fmt(pending)}</span>
        ${!r.recurring ? `<span class="rec-total">de ${fmt(r.totalAmount)} total</span>` : ''}
      </div>
      ${!r.recurring ? `<div class="rec-due">Seña cobrada: ${fmt(r.deposit)} · Resta cobrar: ${fmt(pending)}</div>` : ''}
      ${dueLabel ? `<div class="rec-due">${dueLabel}</div>` : ''}
      <div class="rec-actions">
        ${!settled ? `<span class="rec-btn paidbtn" data-paid="${r.id}">Marcar cobrado</span>` : ''}
        <span class="rec-btn delbtn" data-del="${r.id}">Eliminar</span>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-paid]').forEach(btn=> btn.addEventListener('click', ()=> markReceivablePaid(btn.getAttribute('data-paid'))));
  el.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=>{
    if(confirm('¿Eliminar este cobro?')) deleteReceivable(btn.getAttribute('data-del'));
  }));
}

/* ---------------- RENDER: Historial ------------------------------------- */
function renderHistory(){
  const list = document.getElementById('history-list');
  if(!ready.tx){ list.innerHTML = '<div style="padding:24px 0; text-align:center; color:var(--text-faint); font-size:13px;">Cargando…</div>'; return; }
  const txArr = transactionsArray();
  if(!txArr.length){
    list.innerHTML = '<div style="padding:24px 0; text-align:center; color:var(--text-faint); font-size:13px;">Todavía no hay movimientos.</div>';
    return;
  }
  list.innerHTML = txArr.map(tx=>{
    const d = new Date(tx.ts);
    const dateStr = d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' · ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    const sign = tx.type === 'income' ? '+' : '-';
    const cls = tx.type === 'income' ? 'pos' : 'neg';
    const editBtn = tx.type === 'income' ? `<span class="edit-cat-btn" data-edit="${tx.id}" title="Editar categoría">✎</span>` : '';
    return '<div class="hrow"><div><div><span class="hrow-cat" data-cat-id="'+tx.id+'">'+tx.category+'</span>'+editBtn+'</div><div class="meta">'+dateStr+'</div></div>' +
      '<div style="display:flex; align-items:center; gap:10px;"><span class="amt '+cls+'">'+sign+fmt(tx.amount)+'</span>' +
      '<span class="undo-btn" data-undo="'+tx.id+'">Deshacer</span></div></div>';
  }).join('');
  list.querySelectorAll('[data-undo]').forEach(btn=> btn.addEventListener('click', ()=> undoTransaction(btn.getAttribute('data-undo'))));
  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-edit');
      const catSpan = list.querySelector('[data-cat-id="'+id+'"]');
      const tx = transactions[id];
      if(!tx || !catSpan) return;
      const input = document.createElement('input');
      input.type = 'text'; input.value = tx.category; input.className = 'cat-edit-input';
      catSpan.replaceWith(input);
      btn.style.display = 'none';
      input.focus(); input.select();
      let committed = false;
      function commit(){
        if(committed) return; committed = true;
        const val = input.value.trim();
        if(val) update(ref(db, PATH.tx + '/' + id), {category: val}).catch(err=>console.error(err));
        else renderHistory();
      }
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
        if(ev.key === 'Escape'){ committed = true; renderHistory(); }
      });
      input.addEventListener('blur', commit);
    });
  });
}

function renderAll(){
  try{ renderStats(); }catch(e){ console.error('AIRA: error en renderStats ->', e); }
  try{ renderFunds(); }catch(e){ console.error('AIRA: error en renderFunds ->', e); }
  try{ renderReceivables(); }catch(e){ console.error('AIRA: error en renderReceivables ->', e); }
  try{ renderHistory(); }catch(e){ console.error('AIRA: error en renderHistory ->', e); }
}

function paintSettingsForm(){
  const el = document.getElementById('funds-edit-list');
  el.innerHTML = settingsDraft.map((f,i)=>`
    <div class="fund-edit-card" data-idx="${i}">
      <div class="fund-edit-head">

      </div>

      </div>

  el.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{

      settingsDraft[idx][field] = field === 'name' ? e.target.value : (parseFloat(e.target.value)||0);
      updatePctTotal();
    });
  });
  el.querySelectorAll('[data-toggle]').forEach(tg=>{
    tg.addEventListener('click', e=>{
      const idx = +e.target.closest('.fund-edit-card').getAttribute('data-idx');
      settingsDraft[idx].resetMonthly = !settingsDraft[idx].resetMonthly;
      tg.classList.toggle('on', settingsDraft[idx].resetMonthly);
    });
  });
  el.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = +e.target.getAttribute('data-remove');
      if(confirm('¿Eliminar este fondo?')){ settingsDraft.splice(idx,1); paintSettingsForm(); }
    });
  });
  updatePctTotal();

function updatePctTotal(){
  const total = settingsDraft.reduce((s,f)=>s+(f.percent||0),0);
  const label = document.getElementById('pct-total-label');
  label.textContent = 'Total asignado: ' + total + '%';
  label.classList.toggle('bad', total !== 100);
}

  settingsDraft.push({id:null, name:'Nuevo fondo', percent:0, goal:0, resetMonthly:false, priority:settingsDraft.length+1});
  paintSettingsForm();
});
document.getElementById('btn-save-settings').addEventListener('click', ()=>{
  const newFunds = {};
  const balancePatch = {};
  settingsDraft.forEach((f,i)=>{
    const id = f.id || uid();
    newFunds[id] = {name:(f.name||'Fondo').trim() || 'Fondo', percent:f.percent||0, goal:f.goal||0, resetMonthly:!!f.resetMonthly, priority:i+1};
    if(!(id in balances)) balancePatch[id] = {value:0, monthKey:currentMonthKey()};
  });
  Object.keys(funds||{}).forEach(oldId=>{ if(!newFunds[oldId]) balancePatch[oldId] = null; });
  update(R.config, {funds:newFunds}).catch(err=>{ console.error(err); alert('No se pudo guardar la configuración. Revisá tu conexión a internet e intentá de nuevo.'); });
  if(Object.keys(balancePatch).length) update(R.balances, balancePatch).catch(err=>console.error(err));

});

/* ---------------- SERVICE WORKER (opcional, no bloquea si falla) --------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

renderChat();
renderAll();
</script>
