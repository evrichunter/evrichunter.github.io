<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AIRA — Asistente Financiero</title>
<meta name="theme-color" content="#070707">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070707;
    --bg-elev:#0f0f0f;
    --card:#141414;
    --card-2:#1a1a1a;
    --line:#242422;
    --gold:#c8a96e;
    --gold-soft:rgba(200,169,110,.14);
    --gold-dim:#8a744a;
    --text:#f2f0ea;
    --text-dim:#96958d;
    --text-faint:#5c5b54;
    --green:#7fae82;
    --red:#c07b6a;
    --radius:20px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans', -apple-system, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Syne', sans-serif;}
  #app{
    max-width:520px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(circle at 15% -10%, rgba(200,169,110,.07), transparent 45%),
      var(--bg);
  }
 
  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px;
    flex-shrink:0;
  }
  header .brand{display:flex; flex-direction:column;}
  header .brand .eyebrow{font-size:10px; letter-spacing:.18em; color:var(--text-faint); text-transform:uppercase;}
  header .brand h1{font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin:2px 0 0; letter-spacing:.01em;}
  header .brand h1 span{color:var(--gold);}
  header .actions{display:flex; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer;
    transition:background .2s, color .2s, transform .15s;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:hover{color:var(--gold); border-color:var(--gold-dim);}
  .icon-btn svg{width:17px; height:17px;}
 
  /* MAIN VIEWS */
  main{flex:1; min-height:0; position:relative;}
  .view{
    position:absolute; inset:0;
    overflow-y:auto;
    padding:0 20px 24px;
    opacity:0; pointer-events:none;
    transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .view.active{opacity:1; pointer-events:auto; transform:translateY(0);}
  .view::-webkit-scrollbar{width:0;}
 
  /* CHAT */
  #view-chat{display:flex; flex-direction:column; padding-bottom:0;}
  #chat-log{flex:1; display:flex; flex-direction:column; gap:10px; padding-bottom:14px;}
  .msg{max-width:86%; padding:12px 15px; border-radius:16px; font-size:14.5px; line-height:1.5; animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .msg.user{align-self:flex-end; background:var(--gold); color:#161105; border-bottom-right-radius:5px; font-weight:500;}
  .msg.bot{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; white-space:pre-wrap;}
  .msg.bot b{color:var(--gold); font-family:'Syne',sans-serif;}
  .msg .amt-pos{color:var(--green); font-weight:600;}
  .msg .amt-neg{color:var(--red); font-weight:600;}
  .msg-time{font-size:10px; color:var(--text-faint); margin-top:4px; align-self:flex-end;}
  .empty-chat{margin:auto; text-align:center; color:var(--text-faint); font-size:13.5px; padding:40px 20px;}
  .empty-chat b{display:block; color:var(--text-dim); font-family:'Syne',sans-serif; font-size:16px; margin-bottom:6px;}
 
  .chat-input-bar{
    flex-shrink:0; display:flex; align-items:flex-end; gap:8px;
    padding:12px 0 calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
  }
  #chat-input{
    flex:1; resize:none; max-height:110px;
    background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:20px; padding:12px 16px; font-size:15px; font-family:inherit;
    outline:none;
  }
  #chat-input:focus{border-color:var(--gold-dim);}
  #chat-send{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background:var(--gold); border:none; color:#161105;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .15s;
  }
  #chat-send:active{transform:scale(.9);}
  #chat-send svg{width:18px; height:18px;}
 
  /* SECTION HEADINGS */
  .section-pad{padding-top:6px;}
  .section-title{font-family:'Syne',sans-serif; font-size:22px; font-weight:700; margin:4px 0 18px;}
 
  /* STATS */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px;}
  .stat-card .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
  .stat-card .value{font-family:'Syne',sans-serif; font-size:20px; font-weight:700; margin-top:6px;}
  .stat-card.wide{grid-column:1/3; display:flex; justify-content:space-between; align-items:center;}
  .stat-card.accent{background:var(--gold-soft); border-color:var(--gold-dim);}
  .stat-card.accent .value{color:var(--gold);}
 
  .cat-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .cat-row .cat-name{width:108px; flex-shrink:0; font-size:13px; color:var(--text-dim);}
  .cat-bar-track{flex:1; height:8px; background:var(--card-2); border-radius:6px; overflow:hidden;}
  .cat-bar-fill{height:100%; background:var(--gold); border-radius:6px; transition:width .5s ease;}
  .cat-amt{width:70px; text-align:right; font-size:12.5px; color:var(--text-dim); flex-shrink:0;}
 
  .subhead{font-family:'Syne',sans-serif; font-size:14px; color:var(--text-dim); margin:20px 0 12px; text-transform:uppercase; letter-spacing:.06em;}
 
  /* PIE CHARTS */
  .pie-wrap{display:flex; justify-content:center; margin-bottom:14px;}
  .pie-wrap svg{filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));}
  .legend-row{display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:12.5px; color:var(--text-dim); border-bottom:1px solid var(--line);}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .legend-label{flex:1; color:var(--text); display:flex; align-items:center; gap:6px;}
  .legend-pct{color:var(--text-faint); width:36px; text-align:right; flex-shrink:0;}
  .legend-amt{width:82px; text-align:right; color:var(--text-dim); flex-shrink:0;}
  .pie-empty{text-align:center; color:var(--text-faint); font-size:13px; padding:16px 0 4px;}
  .edit-cat-btn{color:var(--text-faint); cursor:pointer; margin-left:6px; font-size:12px;}
  .edit-cat-btn:hover{color:var(--gold);}
  .cat-edit-input{
    background:var(--card-2); border:1px solid var(--gold-dim); color:var(--text);
    border-radius:8px; padding:4px 8px; font-size:13px; font-family:inherit; width:150px;
  }
 
  .oblig-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .oblig-row:last-child{border-bottom:none;}
  .oblig-row .pend{color:var(--red);}
  .oblig-row .done{color:var(--green);}
 
  /* FUNDS */
  .fund-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px;}
  .fund-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .fund-name{font-family:'Syne',sans-serif; font-size:15px; font-weight:600;}
  .fund-pct{font-size:11px; color:var(--text-faint); background:var(--card-2); padding:3px 8px; border-radius:20px;}
  .fund-amt{font-size:22px; font-family:'Syne',sans-serif; font-weight:700; margin-bottom:8px;}
  .fund-amt .goal{font-size:13px; color:var(--text-faint); font-weight:400; font-family:'DM Sans',sans-serif;}
  .fund-bar-track{height:7px; background:var(--card-2); border-radius:6px; overflow:hidden;}
  .fund-bar-fill{height:100%; border-radius:6px; background:var(--gold); transition:width .6s ease;}
  .fund-bar-fill.done{background:var(--green);}
  .fund-tag{display:inline-block; margin-top:8px; font-size:10.5px; color:var(--green); background:rgba(127,174,130,.12); padding:3px 8px; border-radius:20px;}
 
  /* RECEIVABLES (Cobros) */
  .rec-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px;}
  .rec-card.paid{opacity:.55;}
  .rec-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .rec-client{font-family:'Syne',sans-serif; font-size:15px; font-weight:600;}
  .rec-concept{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .rec-type-tag{font-size:10px; color:var(--text-faint); background:var(--card-2); padding:3px 8px; border-radius:20px; flex-shrink:0; margin-left:8px;}
  .rec-amounts{display:flex; justify-content:space-between; align-items:baseline; margin:10px 0;}
  .rec-pending{font-family:'Syne',sans-serif; font-size:20px; font-weight:700;}
  .rec-total{font-size:11.5px; color:var(--text-faint);}
  .rec-due{font-size:11.5px; color:var(--text-faint); margin-bottom:10px;}
  .rec-actions{display:flex; gap:8px;}
  .rec-btn{flex:1; text-align:center; padding:9px; border-radius:10px; font-size:12.5px; cursor:pointer; border:1px solid var(--line);}
  .rec-btn.paidbtn{background:var(--gold-soft); border-color:var(--gold-dim); color:var(--gold);}
  .rec-btn.delbtn{background:none; color:var(--text-faint);}
  .rec-btn.delbtn:hover{color:var(--red); border-color:var(--red);}
  .rec-empty{text-align:center; color:var(--text-faint); font-size:13px; padding:30px 0;}
  .type-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .type-toggle button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text-dim); font-size:13px; cursor:pointer; font-family:inherit;}
  .type-toggle button.on{background:var(--gold-soft); border-color:var(--gold-dim); color:var(--gold);}
 
  /* BOTTOM NAV */
  nav#bottomnav{
    flex-shrink:0; display:flex; justify-content:space-around;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--bg-elev);
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-faint); font-family:'DM Sans',sans-serif;
    font-size:10.5px; padding:6px 12px; cursor:pointer; transition:color .2s;
  }
  .navbtn svg{width:21px; height:21px;}
  .navbtn.active{color:var(--gold);}
 
  /* MODAL / OVERLAY SHEETS */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .sheet-backdrop.active{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translate(-50%, 100%);
    width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    background:var(--bg-elev); border-radius:24px 24px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:18px 20px calc(24px + env(safe-area-inset-bottom));
    transition:transform .3s cubic-bezier(.32,.72,0,1); z-index:51;
  }
  .sheet-backdrop.active .sheet{transform:translate(-50%, 0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;}
  .sheet-title{font-family:'Syne',sans-serif; font-size:19px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
 
  .hrow{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .hrow:last-child{border-bottom:none;}
  .hrow .amt{font-family:'Syne',sans-serif; font-weight:700;}
  .hrow .amt.pos{color:var(--green);}
  .hrow .amt.neg{color:var(--red);}
  .hrow .meta{color:var(--text-faint); font-size:11.5px;}
  .undo-btn{background:var(--card); border:1px solid var(--line); color:var(--text-faint); font-size:11px; padding:5px 10px; border-radius:14px; cursor:pointer;}
  .undo-btn:hover{color:var(--red); border-color:var(--red);}
 
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input{width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; font-family:inherit;}
  .field input:focus{outline:none; border-color:var(--gold-dim);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .toggle-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0;}
  .toggle{width:42px; height:24px; border-radius:20px; background:var(--card-2); position:relative; cursor:pointer; border:1px solid var(--line); flex-shrink:0;}
  .toggle.on{background:var(--gold-soft); border-color:var(--gold-dim);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-faint); transition:transform .2s, background .2s;}
  .toggle.on .knob{transform:translateX(18px); background:var(--gold);}
 
  .fund-edit-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .fund-edit-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fund-edit-head input.name-input{background:transparent; border:none; font-family:'Syne',sans-serif; font-size:15px; font-weight:600; color:var(--text); padding:0;}
  .remove-fund{color:var(--red); font-size:11px; cursor:pointer; opacity:.7;}
  .pct-total{font-size:12px; color:var(--text-dim); text-align:center; margin:6px 0 18px;}
  .pct-total.bad{color:var(--red);}
 
  .btn-primary{
    width:100%; background:var(--gold); color:#161105; border:none; padding:14px; border-radius:14px;
    font-family:'Syne',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{
    width:100%; background:none; color:var(--text-dim); border:1px dashed var(--line); padding:12px; border-radius:14px;
    font-size:13px; cursor:pointer; margin-top:4px;
  }
  .close-x{color:var(--text-faint); cursor:pointer; font-size:20px; line-height:1;}
 
  /* SPLASH SCREEN */
  #splash{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(200,169,110,.10), transparent 60%), var(--bg);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-inner{position:relative; display:flex; flex-direction:column; align-items:center;}
  .splash-logo{
    font-family:'Syne',sans-serif; font-weight:800; font-size:52px; letter-spacing:.03em;
    background:linear-gradient(120deg, var(--text) 35%, var(--gold) 50%, var(--text) 65%);
    background-size:280% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:aira-shine 2.2s ease-in-out infinite;
  }
  .splash-logo span{ color:var(--gold); -webkit-text-fill-color:var(--gold); }
  @keyframes aira-shine{ 0%{background-position:220% 0;} 100%{background-position:-120% 0;} }
  .splash-sub{
    margin-top:14px; font-size:13.5px; color:var(--text-dim); text-align:center; letter-spacing:.01em;
    opacity:0; animation:aira-fadein .7s ease forwards; animation-delay:.55s;
  }
  @keyframes aira-fadein{ to{opacity:1;} }
  .splash-spark{position:absolute; color:var(--gold); opacity:0; animation:aira-spark 1.6s ease-in-out infinite;}
  .splash-spark.s1{top:-18px; left:-28px; font-size:16px; animation-delay:.2s;}
  .splash-spark.s2{top:6px; right:-34px; font-size:12px; animation-delay:.7s;}
  .splash-spark.s3{bottom:-14px; left:20%; font-size:10px; animation-delay:1.1s;}
  @keyframes aira-spark{ 0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:1; transform:scale(1.15);} }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <span class="splash-spark s1">✦</span>
    <span class="splash-spark s2">✦</span>
    <span class="splash-spark s3">✦</span>
    <div class="splash-logo">AIR<span>A</span></div>
    <div class="splash-sub">Bienvenido Evric, así están tus cuentas</div>
  </div>
</div>
 
<div id="app">
 
  <header>
    <div class="brand">
      <span class="eyebrow">Asesora Inteligente de Recursos y Ahorro</span>
      <h1>AIR<span>A</span></h1>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-clear-chat" title="Vaciar chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
      <button class="icon-btn" id="btn-history" title="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
 
  <main>
    <!-- CHAT -->
    <section id="view-chat" class="view active">
      <div id="chat-log"></div>
      <div class="chat-input-bar">
        <textarea id="chat-input" rows="1" placeholder="Entraron 90000..."></textarea>
        <button id="chat-send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>
    </section>
 
    <!-- STATS -->
    <section id="view-stats" class="view section-pad">
      <div class="section-title">Estado financiero</div>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="subhead">Ingreso por origen</div>
      <div id="income-breakdown"></div>
      <div class="subhead">Gasto por categoría</div>
      <div id="cat-breakdown"></div>
      <div class="subhead">Obligaciones del mes</div>
      <div id="oblig-list"></div>
    </section>
 
    <!-- FUNDS -->
    <section id="view-funds" class="view section-pad">
      <div class="section-title">Fondos</div>
      <div id="funds-list"></div>
    </section>
 
    <!-- RECEIVABLES -->
    <section id="view-receivables" class="view section-pad">
      <div class="section-title">Cobros</div>
      <div id="receivables-list"></div>
      <button class="btn-ghost" id="btn-add-receivable">+ Nuevo cobro</button>
    </section>
  </main>
 
  <nav id="bottomnav">
    <button class="navbtn active" data-view="chat">

<script>
(function(){
"use strict";
 
/* ---------------- DATA MODEL ---------------- */
const STORAGE_KEY = 'noa_finance_data_v1';
 
function defaultData(){
  return {
    funds: [
      {id:'personal',  name:'Dinero Personal',      percent:20, goal:0,      current:0, resetMonthly:false, priority:1},
      {id:'pareja',    name:'Pareja',                percent:5,  goal:0,      current:0, resetMonthly:false, priority:2},
      {id:'alquiler',  name:'Alquiler',              percent:20, goal:300000, current:0, resetMonthly:true,  priority:3},
      {id:'servicios', name:'Servicios',             percent:10, goal:80000,  current:0, resetMonthly:true,  priority:4},
      {id:'deuda',     name:'Deuda',                 percent:10, goal:0,      current:0, resetMonthly:false, priority:5},
      {id:'emergencia',name:'Emergencia',            percent:15, goal:0,      current:0, resetMonthly:false, priority:6},
      {id:'equipos',   name:'Equipos y Formación',   percent:10, goal:0,      current:0, resetMonthly:false, priority:7},
      {id:'marketing', name:'Marketing',             percent:5,  goal:0,      current:0, resetMonthly:false, priority:8},
      {id:'inversiones',name:'Inversiones',          percent:5,  goal:0,      current:0, resetMonthly:false, priority:9}
    ],
    transactions: [],
    receivables: [],
    chatLog: [],
    updatedAt: 0,
    lastResetMonth: currentMonthKey(),
    pending: null
  };
}
 
function currentMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+d.getMonth();
}
 
let data = load();
 
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if(!parsed.funds || !Array.isArray(parsed.funds)) return defaultData();
    if(!Array.isArray(parsed.chatLog)) parsed.chatLog = [];
    if(!Array.isArray(parsed.transactions)) parsed.transactions = [];
    if(!Array.isArray(parsed.receivables)) parsed.receivables = [];
    if(typeof parsed.updatedAt !== 'number') parsed.updatedAt = 0;
    return parsed;
  }catch(e){ return defaultData(); }
}
function save(){ data.updatedAt = Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
 
function maybeMonthlyReset(){
  const key = currentMonthKey();
  if(data.lastResetMonth !== key){
    data.funds.forEach(f=>{ if(f.resetMonthly) f.current = 0; });
    (data.receivables||[]).forEach(r=>{ if(r.recurring) r.paidThisMonth = false; });
    data.lastResetMonth = key;
    save();
  }
}
maybeMonthlyReset();
 
/* ---------------- HELPERS ---------------- */
function fmt(n){
  n = Math.round(n||0);
  return '$' + n.toLocaleString('es-AR');
}
 
/* ---------------- PIE CHART HELPERS ---------------- */
const PIE_COLORS = ['#c8a96e','#7fae82','#c07b6a','#7a93c0','#a586c9','#6fbfae','#d1975c','#c98aa8','#9fb768','#7f9bc4'];
function colorForLabel(label){
  let hash = 0;
  for(let i=0;i<label.length;i++){ hash = (hash*31 + label.charCodeAt(i)) >>> 0; }
  return PIE_COLORS[hash % PIE_COLORS.length];
}
function buildPieSVG(entries, size){
  size = size || 150;
  const total = entries.reduce((s,[,v])=>s+v,0) || 1;
  const R = size/2, cx = R, cy = R;
  if(entries.length === 1){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${R-1}" fill="${colorForLabel(entries[0][0])}"/></svg>`;
  }
  let angle = -90;
  const toRad = d => d*Math.PI/180;
  const paths = entries.map(([label, val])=>{
    const sweep = (val/total)*360;
    const start = angle, end = angle + sweep;
    angle = end;
    const large = sweep > 180 ? 1 : 0;
    const x1 = cx + R*Math.cos(toRad(start)), y1 = cy + R*Math.sin(toRad(start));
    const x2 = cx + R*Math.cos(toRad(end)), y2 = cy + R*Math.sin(toRad(end));
    return `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${colorForLabel(label)}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}
function buildLegend(entries, total){
  return entries.map(([label,val])=>{
    const pct = total ? Math.round(val/total*100) : 0;
    return `<div class="legend-row"><span class="legend-dot" style="background:${colorForLabel(label)}"></span><span class="legend-label">${label}</span><span class="legend-pct">${pct}%</span><span class="legend-amt">${fmt(val)}</span></div>`;
  }).join('');
}
function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function fundById(id){ return data.funds.find(f=>f.id===id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
 
function receivablePending(r){
  if(r.recurring) return r.paidThisMonth ? 0 : r.monthlyAmount;
  return Math.max(0, (r.totalAmount||0) - (r.deposit||0));
}
function receivableIsSettled(r){
  return r.recurring ? !!r.paidThisMonth : receivablePending(r) <= 0;
}
function markReceivablePaid(id){
  const r = data.receivables.find(x=>x.id===id);
  if(!r) return;
  const amt = receivablePending(r);
  if(amt > 0){
    const breakdown = distributeIncome(amt);
    recordTransaction({id:uid(), ts:Date.now(), type:'income', amount:amt, category: r.recurring ? 'Membresía — '+r.client : 'Cobro — '+r.client, raw:'', breakdown});
  }
  if(r.recurring){ r.paidThisMonth = true; }
  else { r.deposit = r.totalAmount; }
  save();
  renderAll();
}
function deleteReceivable(id){
  const idx = data.receivables.findIndex(x=>x.id===id);
  if(idx===-1) return;
  data.receivables.splice(idx,1);
  save();
  renderAll();
}
 
/* ---------------- NLU PARSER ---------------- */
const INCOME_WORDS  = ['entr','ingres','recib','cobr','deposit','gan','entrada','me pagaron'];
const REFUND_WORDS  = ['devol','reembols'];
const EXPENSE_WORDS = ['gast','pagu','compr','sali','saque','abon'];
 
const CATEGORY_MAP = [
  {keys:['alquiler','renta'], cat:'Alquiler', fund:'alquiler'},
  {keys:['luz','gas natural',' gas ','internet','wifi','telefon','celular','servicio'], cat:'Servicios', fund:'servicios'},
  {keys:['plugin','sinte','microfono','interfaz','monitores de estudio','cable','equipo','licencia','software audio'], cat:'Equipos y Formación', fund:'equipos'},
  {keys:['estudio','formacion','curso','capacitacion'], cat:'Equipos y Formación', fund:'equipos'},
  {keys:['marketing','publicidad','ads','anuncio','promocion'], cat:'Marketing', fund:'marketing'},
  {keys:['inversion','cripto','acciones','plazo fijo'], cat:'Inversiones', fund:'inversiones'},
  {keys:['deuda','prestamo','cuota tarjeta','tarjeta de credito'], cat:'Deuda', fund:'deuda'},
  {keys:['pareja','novia','novio','esposa','esposo'], cat:'Pareja', fund:'pareja'},
  {keys:['emergencia'], cat:'Emergencia', fund:'emergencia'},
  {keys:['supermercado','super','almacen','verduleria','carniceria'], cat:'Supermercado', fund:'personal'},
  {keys:['uber','taxi','remis','nafta','combustible','colectivo','subte'], cat:'Transporte', fund:'personal'},
  {keys:['delivery','comida','restaurant','resto','pedidos ya','rappi'], cat:'Comida afuera', fund:'personal'},
  {keys:['ropa','indumentaria'], cat:'Ropa', fund:'personal'},
  {keys:['salud','farmacia','medico','remedios'], cat:'Salud', fund:'personal'}
];
 
function findAmount(normText){
  const matches = normText.match(/\d[\d.,]*\d|\d/g);
  if(!matches) return null;
  let best = null, bestVal = -1;
  matches.forEach(m=>{
    const digits = m.replace(/[.,]/g,'');
    const val = parseInt(digits, 10);
    if(!isNaN(val) && val > bestVal){ bestVal = val; best = val; }
  });
  return best;
}
 
function detectCategory(normText){
  for(const row of CATEGORY_MAP){
    for(const k of row.keys){
      if(normText.includes(k)) return row;
    }
  }
  return null;
}
 
function detectType(normText){
  const hasRefund = REFUND_WORDS.some(w=>normText.includes(w));
  if(hasRefund) return 'refund';
  const hasIncome = INCOME_WORDS.some(w=>normText.includes(w));
  const hasExpense = EXPENSE_WORDS.some(w=>normText.includes(w));
  if(hasExpense) return 'expense';
  if(hasIncome) return 'income';
  return null;
}
 
function parseMessage(raw){
  const n = normalize(raw);
  const type = detectType(n);
  const amount = findAmount(n);
  const catRow = detectCategory(n);
  return {raw, type, amount, catRow};
}
 
/* ---------------- FINANCE ENGINE ---------------- */
function isFundComplete(f){ return f.goal > 0 && f.current >= f.goal; }
 
function distributeIncome(amount){
  const breakdown = [];
  const contributions = {}; // fundId -> monto acumulado en ESTA transacción
  let remaining = amount;
  let pool = data.funds.filter(f=>!isFundComplete(f));
 
  let guard = 0;
  while(remaining > 0 && pool.length && guard < 20){
    guard++;
    const totalPct = pool.reduce((s,f)=>s+f.percent,0) || 1;
    let distributedThisPass = 0;
    const stillOpen = [];
    pool.slice().sort((a,b)=>a.priority-b.priority).forEach(f=>{
      let share = Math.round(remaining * (f.percent/totalPct));
      if(f.goal > 0){
        const room = f.goal - f.current - (contributions[f.id]||0);
        if(share > room) share = Math.max(room,0);
      }
      if(share > remaining - distributedThisPass) share = remaining - distributedThisPass;
      if(share > 0){
        contributions[f.id] = (contributions[f.id]||0) + share;
        distributedThisPass += share;
      }
      const projectedTotal = f.current + (contributions[f.id]||0);
      const willBeFull = f.goal > 0 && projectedTotal >= f.goal;
      if(!willBeFull) stillOpen.push(f);
    });
    remaining -= distributedThisPass;
    pool = stillOpen;
    if(distributedThisPass === 0) break; // nadie pudo absorber más en esta pasada
  }
 
  Object.keys(contributions).forEach(fundId=>{
    const f = fundById(fundId);
    if(!f || contributions[fundId] <= 0) return;
    f.current += contributions[fundId];
    breakdown.push({fundId:f.id, name:f.name, amount:contributions[fundId], completed:isFundComplete(f)});
  });
 
  if(remaining > 0){
    const fallback = fundById('personal');
    fallback.current += remaining;
    breakdown.push({fundId:'personal', name:fallback.name, amount:remaining, completed:false});
  }
  return breakdown;
}
 
function recordTransaction(tx){
  data.transactions.unshift(tx);
  save();
}
 
function undoTransaction(id){
  const idx = data.transactions.findIndex(t=>t.id===id);
  if(idx === -1) return;
  const tx = data.transactions[idx];
  (tx.breakdown||[]).forEach(b=>{
    const f = fundById(b.fundId);
    if(f) f.current -= b.amount;
  });
  data.transactions.splice(idx,1);
  save();
  renderAll();
}
 
/* ---------------- CHAT RENDER ---------------- */
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
 
function addMsg(text, who, skipSave){
  const emptyState = chatLog.querySelector('.empty-chat');
  if(emptyState) emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  wrap.innerHTML = text;
  chatLog.appendChild(wrap);
  chatLog.parentElement.scrollTop = chatLog.parentElement.scrollHeight;
  if(!skipSave){
    data.chatLog.push({text, who, ts:Date.now()});
    save();
  }
}
 
function renderEmptyChat(){
  if(data.chatLog && data.chatLog.length){
    chatLog.innerHTML = '';
    data.chatLog.forEach(m=> addMsg(m.text, m.who, true));
    return;
  }
  if(chatLog.children.length) return;
  chatLog.innerHTML = '<div class="empty-chat"><b>Contame qué pasó</b>Escribí algo como "Entraron 175000" o "Gasté 8500 en supermercado". Yo me encargo del resto.</div>';
}
 
function handleUserMessage(text){
  text = text.trim();
  if(!text) return;
  addMsg(escapeHtml(text), 'user');
 
  if(data.pending){
    const n = normalize(text);
    if(n.includes('ingreso') || n.includes('entro') || n.includes('cobre')){
      processIncome(data.pending.amount, data.pending.raw, data.pending.catRow);
      data.pending = null; save();
      return;
    }
    if(n.includes('gasto') || n.includes('pague') || n.includes('gaste')){
      processExpense(data.pending.amount, data.pending.raw, data.pending.catRow);
      data.pending = null; save();
      return;
    }
  }
 
  const parsed = parseMessage(text);
 
  if(parsed.type === 'refund'){
    const amt = parsed.amount || 0;
    if(!amt){ addMsg('¿De cuánto fue la devolución? Decime el monto.', 'bot'); return; }
    const personal = fundById('personal');
    personal.current += amt;
    recordTransaction({id:uid(), ts:Date.now(), type:'income', amount:amt, category:'Devolución', raw:text, breakdown:[{fundId:'personal', name:personal.name, amount:amt}]});
    addMsg('<b>Reembolso recibido</b>\n' + fmt(amt) + ' agregado directamente a <b>Dinero Personal</b>.\nNuevo saldo: ' + fmt(personal.current), 'bot');
    renderAll();
    return;
  }
 
  if(parsed.type === 'income'){
    if(!parsed.amount){ addMsg('¿De cuánto fue el ingreso? Decime el monto, por ejemplo "Entraron 90000".', 'bot'); return; }
    processIncome(parsed.amount, text, parsed.catRow);
    return;
  }
 
  if(parsed.type === 'expense'){
    let amt = parsed.amount;
    if(!amt && parsed.catRow){
      const f = fundById(parsed.catRow.fund);
      if(f && f.goal > 0 && f.current > 0){
        amt = f.current; // pagar la obligación completa acumulada
      }
    }
    if(!amt){ addMsg('¿De cuánto fue el gasto? Decime el monto, por ejemplo "Gasté 8500 en supermercado".', 'bot'); return; }
    processExpense(amt, text, parsed.catRow);
    return;
  }
 
  // ambiguous — ask for clarification
  if(parsed.amount){
    data.pending = {amount: parsed.amount, raw: text, catRow: parsed.catRow};
    save();
    addMsg('No entendí si fue un <b>ingreso</b> o un <b>gasto</b> de ' + fmt(parsed.amount) + '. Respondé "ingreso" o "gasto" para confirmarlo.', 'bot');
    return;
  }
 
  addMsg('No pude identificar un monto en ese mensaje. Probá algo como "Gasté 8500 en supermercado" o "Entraron 90000".', 'bot');
}
 
function processIncome(amount, raw, catRow){
  const breakdown = distributeIncome(amount);
  recordTransaction({id:uid(), ts:Date.now(), type:'income', amount, category: catRow ? catRow.cat : 'Ingreso', raw, breakdown});
  let lines = '<b>Ingreso registrado</b>\n' + fmt(amount) + '\n\nDistribución automática:\n';
  breakdown.forEach(b=>{
    lines += '• ' + b.name + ' <span class="amt-pos">+' + fmt(b.amount) + '</span>' + (b.completed ? ' → completo ✅' : '') + '\n';
  });
  const disponible = data.funds.filter(f=>f.id!=='alquiler' && f.id!=='servicios' && f.id!=='deuda').reduce((s,f)=>s+f.current,0);
  lines += '\nDisponible ahora: ' + fmt(disponible);
  addMsg(lines, 'bot');
  renderAll();
}
 
function processExpense(amount, raw, catRow){
  const fundId = catRow ? catRow.fund : 'personal';
  const f = fundById(fundId) || fundById('personal');
  f.current -= amount;
  const wasComplete = catRow ? false : false;
  const nowIncomplete = f.goal > 0 && f.current < f.goal;
  recordTransaction({id:uid(), ts:Date.now(), type:'expense', amount, category: catRow ? catRow.cat : 'Otros', raw, breakdown:[{fundId:f.id, name:f.name, amount:-amount}]});
  let msg = '<b>Gasto registrado</b>\n' + fmt(amount) + ' — ' + (catRow ? catRow.cat : 'Otros') + '\nFondo afectado: ' + f.name;
  if(f.current < 0) msg += '\n⚠️ Saldo del fondo en negativo.';
  msg += '\nSaldo restante: <span class="' + (f.current>=0?'amt-pos':'amt-neg') + '">' + fmt(f.current) + '</span>';
  addMsg(msg, 'bot');
  renderAll();
}
 
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
 
/* ---------------- HISTORY RENDER ---------------- */
function renderHistory(){
  const list = document.getElementById('history-list');
  if(!data.transactions.length){
    list.innerHTML = '<div style="padding:24px 0; text-align:center; color:var(--text-faint); font-size:13px;">Todavía no hay movimientos.</div>';
    return;
  }
  list.innerHTML = data.transactions.map(tx=>{
    const d = new Date(tx.ts);
    const dateStr = d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' · ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
    const sign = tx.type === 'income' ? '+' : '-';
    const cls = tx.type === 'income' ? 'pos' : 'neg';
    const editBtn = tx.type === 'income' ? `<span class="edit-cat-btn" data-edit="${tx.id}" title="Editar categoría">✎</span>` : '';
    return '<div class="hrow"><div><div><span class="hrow-cat" data-cat-id="'+tx.id+'">'+tx.category+'</span>'+editBtn+'</div><div class="meta">'+dateStr+'</div></div>' +
      '<div style="display:flex; align-items:center; gap:10px;"><span class="amt '+cls+'">'+sign+fmt(tx.amount)+'</span>' +
      '<span class="undo-btn" data-undo="'+tx.id+'">Deshacer</span></div></div>';
  }).join('');
  list.querySelectorAll('[data-undo]').forEach(btn=>{
    btn.addEventListener('click', ()=> undoTransaction(btn.getAttribute('data-undo')));
  });
  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-edit');
      const catSpan = list.querySelector('[data-cat-id="'+id+'"]');
      const tx = data.transactions.find(t=>t.id===id);
      if(!tx || !catSpan) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = tx.category;
      input.className = 'cat-edit-input';
      catSpan.replaceWith(input);
      btn.style.display = 'none';
      input.focus();
      input.select();
      let committed = false;
      function commit(){
        if(committed) return;
        committed = true;
        const val = input.value.trim();
        if(val) tx.category = val;
        save();
        renderAll();
      }
      input.addEventListener('keydown', ev=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
        if(ev.key === 'Escape'){ committed = true; renderHistory(); }
      });
      input.addEventListener('blur', commit);
    });
  });
}
 
/* ---------------- STATS RENDER ---------------- */
function renderStats(){
  const now = new Date();
  const monthTx = data.transactions.filter(t=>{
    const d = new Date(t.ts);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
  const ingresos = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const gastos = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const ahorro = ingresos - gastos;
  const dayOfMonth = now.getDate();
  const promedioDiario = gastos / dayOfMonth;
  const disponible = data.funds.reduce((s,f)=>s+f.current,0);
  const fondosCompletos = data.funds.filter(isFundComplete).length;
 
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="label">Ingresos del mes</div><div class="value">${fmt(ingresos)}</div></div>
    <div class="stat-card"><div class="label">Gastos del mes</div><div class="value">${fmt(gastos)}</div></div>
    <div class="stat-card accent"><div class="label">Ahorro generado</div><div class="value">${fmt(ahorro)}</div></div>
    <div class="stat-card"><div class="label">Promedio diario</div><div class="value">${fmt(promedioDiario)}</div></div>
    <div class="stat-card wide"><div><div class="label">Disponible total</div><div class="value">${fmt(disponible)}</div></div><div style="text-align:right"><div class="label">Fondos completos</div><div class="value">${fondosCompletos}/${data.funds.length}</div></div></div>
  `;
 
  const incomeTotals = {};
  monthTx.filter(t=>t.type==='income').forEach(t=>{
    incomeTotals[t.category] = (incomeTotals[t.category]||0) + t.amount;
  });
  const incomeEntries = Object.entries(incomeTotals).sort((a,b)=>b[1]-a[1]);
  const incomeSum = incomeEntries.reduce((s,[,v])=>s+v,0);
  const incomeEl = document.getElementById('income-breakdown');
  if(!incomeEntries.length){
    incomeEl.innerHTML = '<div class="pie-empty">Sin ingresos registrados este mes.</div>';
  } else {
    incomeEl.innerHTML = `<div class="pie-wrap">${buildPieSVG(incomeEntries, 150)}</div>` + buildLegend(incomeEntries, incomeSum);
  }
 
  const catTotals = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{
    catTotals[t.category] = (catTotals[t.category]||0) + t.amount;
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catSum = catEntries.reduce((s,[,v])=>s+v,0);
  const catEl = document.getElementById('cat-breakdown');
  if(!catEntries.length){
    catEl.innerHTML = '<div class="pie-empty">Sin gastos registrados este mes.</div>';
  } else {
    catEl.innerHTML = `<div class="pie-wrap">${buildPieSVG(catEntries, 150)}</div>` + buildLegend(catEntries, catSum);
  }
 
  const obligFunds = data.funds.filter(f=>f.resetMonthly && f.goal>0);
  const obligEl = document.getElementById('oblig-list');
  if(!obligFunds.length){
    obligEl.innerHTML = '<div style="color:var(--text-faint); font-size:13px; padding:6px 0 4px;">No hay obligaciones configuradas.</div>';
  } else {
    obligEl.innerHTML = obligFunds.map(f=>{
      const done = isFundComplete(f);
      return `<div class="oblig-row"><span>${f.name}</span><span class="${done?'done':'pend'}">${done ? 'Completo ✅' : fmt(f.goal-f.current)+' restante'}</span></div>`;
    }).join('');
  }
}
 
/* ---------------- FUNDS RENDER ---------------- */
function renderFunds(){
  const el = document.getElementById('funds-list');
  el.innerHTML = data.funds.slice().sort((a,b)=>a.priority-b.priority).map(f=>{
    const pct = f.goal>0 ? Math.min(100, f.current/f.goal*100) : null;
    const done = isFundComplete(f);
    return `<div class="fund-card">
      <div class="fund-top"><span class="fund-name">${f.name}</span><span class="fund-pct">${f.percent}%</span></div>
      <div class="fund-amt">${fmt(f.current)} ${f.goal>0 ? '<span class="goal">/ '+fmt(f.goal)+'</span>' : ''}</div>
      ${f.goal>0 ? `<div class="fund-bar-track"><div class="fund-bar-fill ${done?'done':''}" style="width:${pct}%"></div></div>` : ''}
      ${done ? '<span class="fund-tag" style="color:var(--green); background:rgba(127,174,130,.12);">Completo — ya no recibe reparto</span>' : ''}
      ${f.resetMonthly ? '<span class="fund-tag">Se reinicia cada mes</span>' : ''}
    </div>`;
  }).join('');
}
 
function renderAll(){
  try{ renderStats(); }catch(e){ console.error('NOA: error en renderStats ->', e); }
  try{ renderFunds(); }catch(e){ console.error('NOA: error en renderFunds ->', e); }
  try{ renderReceivables(); }catch(e){ console.error('NOA: error en renderReceivables ->', e); }
  try{ renderHistory(); }catch(e){ console.error('NOA: error en renderHistory ->', e); }
}
 
/* ---------------- RECEIVABLES RENDER ---------------- */
function renderReceivables(){
  const el = document.getElementById('receivables-list');
  const list = (data.receivables||[]).slice().sort((a,b)=>{
    const aSettled = receivableIsSettled(a), bSettled = receivableIsSettled(b);
    if(aSettled !== bSettled) return aSettled ? 1 : -1;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  if(!list.length){
    el.innerHTML = '<div class="rec-empty">Todavía no cargaste ningún cobro pendiente.<br>Usá "+ Nuevo cobro" para registrar una seña, un saldo o una membresía.</div>';
    return;
  }
  el.innerHTML = list.map(r=>{
    const pending = receivablePending(r);
    const settled = receivableIsSettled(r);
    const typeLabel = r.recurring ? 'Mensual' : 'Único';
    const dueLabel = r.recurring ? (r.dueNote ? 'Cobra el '+r.dueNote : '') : (r.dueNote ? 'Entrega estimada: '+r.dueNote : '');
    return `<div class="rec-card ${settled?'paid':''}">
      <div class="rec-top">
        <div><div class="rec-client">${r.client||'Sin nombre'}</div><div class="rec-concept">${r.concept||''}</div></div>
        <span class="rec-type-tag">${typeLabel}</span>
      </div>
      <div class="rec-amounts">
        <span class="rec-pending">${settled ? 'Cobrado ✅' : fmt(pending)}</span>
        ${!r.recurring ? `<span class="rec-total">de ${fmt(r.totalAmount)} total</span>` : ''}
      </div>
      ${!r.recurring ? `<div class="rec-due">Seña cobrada: ${fmt(r.deposit)} · Resta cobrar: ${fmt(pending)}</div>` : ''}
      ${dueLabel ? `<div class="rec-due">${dueLabel}</div>` : ''}
      <div class="rec-actions">
        ${!settled ? `<span class="rec-btn paidbtn" data-paid="${r.id}">Marcar cobrado</span>` : ''}
        <span class="rec-btn delbtn" data-del="${r.id}">Eliminar</span>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-paid]').forEach(btn=>{
    btn.addEventListener('click', ()=> markReceivablePaid(btn.getAttribute('data-paid')));
  });
  el.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('¿Eliminar este cobro?')) deleteReceivable(btn.getAttribute('data-del'));
    });
  });
}
 
/* ---------------- SETTINGS SHEET ---------------- */
function renderSettingsForm(){
  const el = document.getElementById('funds-edit-list');
  el.innerHTML = data.funds.map((f,i)=>`
    <div class="fund-edit-card" data-idx="${i}">
      <div class="fund-edit-head">
        <input class="name-input" data-field="name" value="${f.name}">
        <span class="remove-fund" data-remove="${i}">Eliminar</span>
      </div>
      <div class="field-row">
        <div class="field"><label>Porcentaje %</label><input type="number" data-field="percent" value="${f.percent}"></div>
        <div class="field"><label>Meta (0 = sin meta)</label><input type="number" data-field="goal" value="${f.goal}"></div>
      </div>
      <div class="toggle-row">
        <span style="font-size:13px; color:var(--text-dim);">Reiniciar cada mes</span>
        <div class="toggle ${f.resetMonthly?'on':''}" data-toggle="resetMonthly"><div class="knob"></div></div>
      </div>
    </div>
  `).join('');
 
  el.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const card = e.target.closest('.fund-edit-card');
      const idx = +card.getAttribute('data-idx');
      const field = e.target.getAttribute('data-field');
      const val = field === 'name' ? e.target.value : (parseFloat(e.target.value)||0);
      data.funds[idx][field] = val;
      updatePctTotal();
    });
  });
  el.querySelectorAll('[data-toggle]').forEach(tg=>{
    tg.addEventListener('click', e=>{
      const card = e.target.closest('.fund-edit-card');
      const idx = +card.getAttribute('data-idx');
      data.funds[idx].resetMonthly = !data.funds[idx].resetMonthly;
      tg.classList.toggle('on', data.funds[idx].resetMonthly);
    });
  });
  el.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = +e.target.getAttribute('data-remove');
      if(confirm('¿Eliminar este fondo?')){
        data.funds.splice(idx,1);
        renderSettingsForm();
      }
    });
  });
  updatePctTotal();
}
 
function updatePctTotal(){
  const total = data.funds.reduce((s,f)=>s+(f.percent||0),0);
  const label = document.getElementById('pct-total-label');
  label.textContent = 'Total asignado: ' + total + '%';
  label.classList.toggle('bad', total !== 100);
}
 
document.getElementById('btn-add-fund').addEventListener('click', ()=>{
  data.funds.push({id:uid(), name:'Nuevo fondo', percent:0, goal:0, current:0, resetMonthly:false, priority:data.funds.length+1});
  renderSettingsForm();
});
document.getElementById('btn-save-settings').addEventListener('click', ()=>{
  save();
  renderAll();
  closeSheet('settings');
});
 
/* ---------------- NEW RECEIVABLE SHEET WIRING ---------------- */
let recTypeRecurring = false;
const btnTypeUnico = document.getElementById('rec-type-unico');
const btnTypeMensual = document.getElementById('rec-type-mensual');
const fieldsUnico = document.getElementById('rec-fields-unico');
const fieldsMensual = document.getElementById('rec-fields-mensual');
 
function setRecType(recurring){
  recTypeRecurring = recurring;
  btnTypeUnico.classList.toggle('on', !recurring);
  btnTypeMensual.classList.toggle('on', recurring);
  fieldsUnico.style.display = recurring ? 'none' : '';
  fieldsMensual.style.display = recurring ? '' : 'none';
}
btnTypeUnico.addEventListener('click', ()=> setRecType(false));
btnTypeMensual.addEventListener('click', ()=> setRecType(true));
 
function clearReceivableForm(){
  setRecType(false);
  document.getElementById('rec-client').value = '';
  document.getElementById('rec-concept').value = '';
  document.getElementById('rec-total').value = '';
  document.getElementById('rec-deposit').value = '0';
  document.getElementById('rec-due').value = '';
  document.getElementById('rec-monthly').value = '';
  document.getElementById('rec-due-monthly').value = '';
}
 
document.getElementById('btn-add-receivable').addEventListener('click', ()=>{
  clearReceivableForm();
  openSheet('receivable');
});
 
document.getElementById('btn-save-receivable').addEventListener('click', ()=>{
  const client = document.getElementById('rec-client').value.trim();
  const concept = document.getElementById('rec-concept').value.trim();
  if(!client){ alert('Ponele un nombre de cliente al cobro.'); return; }
 
  if(recTypeRecurring){
    const monthlyAmount = parseFloat(document.getElementById('rec-monthly').value) || 0;
    if(monthlyAmount <= 0){ alert('Ingresá el monto mensual.'); return; }
    data.receivables.push({
      id:uid(), client, concept, recurring:true,
      monthlyAmount, paidThisMonth:false,
      dueNote: document.getElementById('rec-due-monthly').value.trim(),
      createdAt: Date.now()
    });
  } else {
    const totalAmount = parseFloat(document.getElementById('rec-total').value) || 0;
    const deposit = parseFloat(document.getElementById('rec-deposit').value) || 0;
    if(totalAmount <= 0){ alert('Ingresá el monto total.'); return; }
    data.receivables.push({
      id:uid(), client, concept, recurring:false,
      totalAmount, deposit,
      dueNote: document.getElementById('rec-due').value.trim(),
      createdAt: Date.now()
    });
    if(deposit > 0){
      const breakdown = distributeIncome(deposit);
      recordTransaction({id:uid(), ts:Date.now(), type:'income', amount:deposit, category:'Seña — '+client, raw:'', breakdown});
    }
  }
  save();
  renderAll();
  closeSheet('receivable');
});
 
/* ---------------- NAVIGATION ---------------- */
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.getAttribute('data-view')).classList.add('active');
  });
});
 
function openSheet(name){
  document.getElementById('backdrop-'+name).classList.add('active');
  if(name==='history') renderHistory();
  if(name==='settings') renderSettingsForm();
}
function closeSheet(name){
  document.getElementById('backdrop-'+name).classList.remove('active');
}
document.getElementById('btn-history').addEventListener('click', ()=>openSheet('history'));
document.getElementById('btn-settings').addEventListener('click', ()=>openSheet('settings'));
document.getElementById('btn-clear-chat').addEventListener('click', ()=>{
  if(!data.chatLog.length){ return; }
  if(confirm('¿Vaciar el chat? Esto no borra tus fondos, historial de movimientos ni cobros, solo la conversación.')){
    data.chatLog = [];
    save();
    chatLog.innerHTML = '';
    renderEmptyChat();
  }
});
document.querySelectorAll('[data-close]').forEach(x=>{
  x.addEventListener('click', ()=>closeSheet(x.getAttribute('data-close')));
});
document.querySelectorAll('.sheet-backdrop').forEach(bd=>{
  bd.addEventListener('click', e=>{ if(e.target===bd) bd.classList.remove('active'); });
});
 
/* ---------------- CHAT INPUT WIRING ---------------- */
document.getElementById('chat-send').addEventListener('click', ()=>{
  const val = chatInput.value;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  handleUserMessage(val);
});
chatInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('chat-send').click();
  }
});
chatInput.addEventListener('input', ()=>{
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(110, chatInput.scrollHeight) + 'px';
});
 
/* ---------------- SERVICE WORKER ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
 
/* ---------------- INIT ---------------- */
renderEmptyChat();
renderAll();
 
const splashEl = document.getElementById('splash');
if(splashEl){
  setTimeout(()=> splashEl.classList.add('hide'), 2400);
  setTimeout(()=> splashEl.remove(), 3000);
}
 
})();
</script>

<!-- ===== Firebase sync (evric-agenda) — capa aditiva, no toca la lógica de arriba ===== -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
 
const firebaseConfig = {
  apiKey: "AIzaSyDWE64UYQMQFKT0nreF7ax59gzI2OsIVmE",
  authDomain: "evric-agenda.firebaseapp.com",
  databaseURL: "https://evric-agenda-default-rtdb.firebaseio.com",
  projectId: "evric-agenda",
  storageBucket: "evric-agenda.firebasestorage.app",
  messagingSenderId: "239254402707",
  appId: "1:239254402707:web:bda9f7ae205b14cb81bf66"
};
 
const STORAGE_KEY = 'noa_finance_data_v1';
const app = initializeApp(firebaseConfig, 'noa-app');
const db = getDatabase(app);
const cloudRef = ref(db, 'noa/data');
 
let syncingFromCloud = false;
let hasReloadedOnce = sessionStorage.getItem('noa_cloud_reloaded') === '1';
let dbConnected = false;
 
/* ---- Indicador visible de sincronización ---- */
const badge = document.createElement('div');
badge.id = 'noa-sync-badge';
badge.className = 'state-connecting';
badge.innerHTML = '<span class="dot"></span><span class="txt">Conectando…</span>';
document.body.appendChild(badge);
 
function setBadge(state, text){
  badge.className = 'state-' + state;
  badge.querySelector('.txt').textContent = text;
}
 
function refreshBadge(){
  if(!dbConnected){ setBadge('error', 'Sin conexión a la nube'); return; }
  setBadge('synced', 'Sincronizado');
}
 
// Conexión real a la base (no es un supuesto: es el estado que reporta Firebase).
onValue(ref(db, '.info/connected'), (snap)=>{
  dbConnected = snap.val() === true;
  refreshBadge();
});
 
function pushToCloud(value){
  setBadge('connecting', 'Guardando…');
  set(cloudRef, value).then(()=>{
    setBadge('synced', 'Guardado en la nube ✓');
    setTimeout(refreshBadge, 4000);
  }).catch(err=>{
    console.error('NOA: error guardando en la nube ->', err.code, err.message);
    setBadge('error', 'Error al guardar: ' + err.code);
  });
}
 
// Interceptamos localStorage.setItem para empujar cada cambio local a la nube,
// sin modificar el motor de la app (que sigue llamando a save() como siempre).
const originalSetItem = localStorage.setItem.bind(localStorage);
localStorage.setItem = function(key, value){
  originalSetItem(key, value);
  if(key === STORAGE_KEY && !syncingFromCloud){
    try{ pushToCloud(JSON.parse(value)); }catch(e){ console.error('NOA: JSON inválido al sincronizar ->', e); }
  }
};
 
// Bajamos los datos de la nube al abrir la app, pero SOLO si son más nuevos
// que lo que ya hay localmente. Esto evita que un snapshot viejo de la nube
// (por ejemplo, guardado en algún momento en que la sincronización todavía
// fallaba) pise datos locales más recientes y reales.
onValue(cloudRef, (snapshot)=>{
  const cloudData = snapshot.val();
  if(!cloudData) return; // nada en la nube todavía: la primera escritura local la va a crear
  if(!cloudData.funds || !Array.isArray(cloudData.funds) || !cloudData.funds.length){
    // Firebase Realtime Database borra los campos con array vacío al guardar
    // (p.ej. "transactions: []" en el primer guardado), así que un snapshot
    // sin "funds" válido está corrupto: no lo bajamos para no romper la app.
    console.warn('NOA: snapshot de la nube con forma inválida, se ignora ->', cloudData);
    return;
  }
  if(!Array.isArray(cloudData.transactions)) cloudData.transactions = [];
  if(!Array.isArray(cloudData.chatLog)) cloudData.chatLog = [];
 
  const localRaw = localStorage.getItem(STORAGE_KEY);
  const localData = localRaw ? JSON.parse(localRaw) : null;
  const localUpdatedAt = localData && typeof localData.updatedAt === 'number' ? localData.updatedAt : 0;
  const cloudUpdatedAt = typeof cloudData.updatedAt === 'number' ? cloudData.updatedAt : 0;
 
  if(cloudUpdatedAt <= localUpdatedAt) return; // lo local es igual o más nuevo: no tocar nada
 
  const cloudRaw = JSON.stringify(cloudData);
  syncingFromCloud = true;
  originalSetItem(STORAGE_KEY, cloudRaw);
  syncingFromCloud = false;
 
  // Si la app ya había renderizado con datos viejos, recargamos una sola vez
  // para que tome el estado sincronizado desde la nube.
  if(!hasReloadedOnce){
    hasReloadedOnce = true;
    sessionStorage.setItem('noa_cloud_reloaded', '1');
    location.reload();
  }
}, (err)=>{
  console.warn('NOA: error leyendo de la nube ->', err.code, err.message);
  setBadge('error', 'Error de lectura (' + err.code + ')');
});
</script>
